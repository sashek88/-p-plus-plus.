[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pplusplus"
version = "0.1.0"
description = "P++: a symbol-based prefix language that compiles to x86-64 assembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hw = ["psutil"]
dev = ["pytest", "ruff"]

[project.scripts]
ppp = "ppp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
